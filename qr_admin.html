<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Admin</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #172554, #2563eb);
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        h1 {
            color: #172554;
        }

        p {
            color: #64748b;
        }

        #qrcode {
            margin: 25px auto;
            width: 300px;
        }

        .kode {
            font-weight: bold;
            color: #172554;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 QR Code Admin</h1>

    <p>Gunakan QR Code ini untuk masuk sebagai Admin</p>

    <div id="qrcode"></div>

    <div class="kode">
        ADMIN-2026-SECRET
    </div>

</div>

<script>
new QRCode(document.getElementById("qrcode"), {
    text: "ADMIN-2026-SECRET",
    width: 300,
    height: 300,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
});
</script>

</body>
